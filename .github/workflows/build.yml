name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=v0.2.0-test-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=$(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MindEcho ${{ steps.version.outputs.tag }}"
          body: |
            ## MindEcho ${{ steps.version.outputs.tag }}

            自动构建于 ${{ steps.version.outputs.date }}

            ### 本次更新
            - 设置页性能优化（消除卡顿）
            - DataStore 读取合并为单次订阅（6次→1次）
            - 文本输入防抖保存（500ms）
            - 设置持久化修复（ioScope 独立生命周期）
            - DeepSeek 模型升级至 deepseek-v4-flash
            - 录音详情页（情绪时间线 + 转录）
            - 每日情绪报告
            - AssemblyAI 转录接入

            ### 注意
            - debug 构建，仅供测试
            - 云端功能需自行配置 API Key
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
